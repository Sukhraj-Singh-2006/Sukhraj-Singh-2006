name: Update GitHub Profile Cards

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate profile cards
        uses: seijikohara/profile-cards-action@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: Sukhraj-Singh-2006
          cards: overview,languages
          output-dir: assets
          themes: light,dark
          commit: true
          commit-message: "chore(profile): refresh GitHub statistics [skip ci]"
