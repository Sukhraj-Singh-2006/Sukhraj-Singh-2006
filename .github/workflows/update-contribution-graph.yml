name: Update Contribution Graph

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution graph
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: Sukhraj-Singh-2006
        run: python3 scripts/generate_contribution_graph.py

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-activity.svg
          if git diff --cached --quiet; then
            echo "No contribution graph changes."
          else
            git commit -m "Update contribution graph"
            git push
          fi
